Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic1.SplitPCM {
	Name "chromeos_Mic1"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Mic2.SplitPCM {
	Name "chromeos_Mic2"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='DAC1 L Mux' IF1 DAC"
		cset "name='DAC1 R Mux' IF1 DAC"
		cset "name='DAC1 MIXL DAC1 Switch' on"
		cset "name='DAC1 MIXR DAC1 Switch' on"
		cset "name='Stereo DAC MIXL DAC L1 Switch' on"
		cset "name='Stereo DAC MIXR DAC R1 Switch' on"
		cset "name='HPOVOL MIXL DAC1 Switch' off"
		cset "name='HPOVOL MIXR DAC1 Switch' off"
		cset "name='Headphone Channel Switch' off"
		cset "name='HPO MIX HPVOL Switch' off"
		cset "name='HPOVOL L Switch' off"
		cset "name='HPOVOL R Switch' off"
		cset "name='DAC L2 Mux' IF2 DAC"
		cset "name='DAC R2 Mux' IF2 DAC"
		cset "name='A DAC2 L Mux' Mono DAC Mixer"
		cset "name='A DAC2 R Mux' Mono DAC Mixer"
		cset "name='Mono DAC MIXL DAC L2 Switch' on"
		cset "name='Mono DAC MIXR DAC R2 Switch' on"
		cset "name='SPK MIXL DAC L2 Switch' off"
		cset "name='SPK MIXR DAC R2 Switch' off"
		cset "name='SPOL MIX SPKVOL L Switch' off"
		cset "name='SPOR MIX SPKVOL R Switch' off"
		cset "name='SPKVOL L Switch' off"
		cset "name='SPKVOL R Switch' off"
		cset "name='Speaker Channel Switch' off"
		cset "name='DAC2 Playback Switch' on"
		cset "name='RECMIXL BST1 Switch' on"
		cset "name='RECMIXR BST1 Switch' on"
		cset "name='Sto1 ADC MIXL ADC2 Switch' off"
		cset "name='Sto1 ADC MIXR ADC2 Switch' off"
		cset "name='Sto1 ADC MIXL ADC1 Switch' on"
		cset "name='Sto1 ADC MIXR ADC1 Switch' on"
		cset "name='ADC Capture Switch' on"
		cset "name='IN1 Boost' 2"
		cset "name='ADC Capture Volume' 28"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='SPK MIXL DAC L2 Switch' on"
		cset "name='SPK MIXR DAC R2 Switch' on"
		cset "name='SPOL MIX SPKVOL L Switch' on"
		cset "name='SPOR MIX SPKVOL R Switch' on"
		cset "name='SPKVOL L Switch' on"
		cset "name='SPKVOL R Switch' on"
		cset "name='Speaker Channel Switch' on"
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
	]
	DisableSequence [
		cset "name='SPK MIXL DAC L2 Switch' off"
		cset "name='SPK MIXR DAC R2 Switch' off"
		cset "name='SPOL MIX SPKVOL L Switch' off"
		cset "name='SPOR MIX SPKVOL R Switch' off"
		cset "name='SPKVOL L Switch' off"
		cset "name='SPKVOL R Switch' off"
		cset "name='Speaker Channel Switch' off"
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "DAC1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='HPOVOL MIXL DAC1 Switch' on"
		cset "name='HPOVOL MIXR DAC1 Switch' on"
		cset "name='Headphone Channel Switch' on"
		cset "name='HPO MIX HPVOL Switch' on"
		cset "name='HPOVOL L Switch' on"
		cset "name='HPOVOL R Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='HPOVOL MIXL DAC1 Switch' off"
		cset "name='HPOVOL MIXR DAC1 Switch' off"
		cset "name='Headphone Channel Switch' off"
		cset "name='HPO MIX HPVOL Switch' off"
		cset "name='HPOVOL L Switch' off"
		cset "name='HPOVOL R Switch' off"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic1"
		Direction Capture
		Device 99
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic2"
		Direction Capture
		Device 99
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},2"
		JackControl "HDMI/DP,pcm=2 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},3"
		JackControl "HDMI/DP,pcm=3 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI3 {
	Comment "HDMI / DisplayPort 3"
	Value {
		PlaybackPriority 700
		PlaybackPCM "hw:${CardId},4"
		JackControl "HDMI/DP,pcm=4 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
