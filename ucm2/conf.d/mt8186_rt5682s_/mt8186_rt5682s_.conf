# mt8186_rt5682s_ cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.corsola-voltorb-1mic-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8186_rt5682s_max98360;(Voltorb;.*)$"
	}
	True.Define.Profile "/conf.d/mt8186_rt5682s_/HiFi-corsola-voltorb-1mic.conf"
}

If.corsola-voltorb-1mic {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8186_rt5682s_max98360;(Voltorb;(sku589824|sku589825|sku2147483391|sku2147483647|00090000|00090001|7ffffeff|7fffffff))$"
	}
	True.Define.Profile "/conf.d/mt8186_rt5682s_/HiFi-corsola-voltorb-1mic.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
