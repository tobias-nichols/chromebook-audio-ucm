LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic {
		type plug
		slave.pcm "hw:${CardId},99"
		ttable.0.0 1
		ttable.1.1 1
	}
}

SectionVerb {
	EnableSequence [
		cset "name='TL DSP1 Firmware' 9"
		cset "name='TL PCM Source' 1"
		cset "name='TL DSP RX1 Source' 1"
		cset "name='TL DSP RX2 Source' 1"
		cset "name='TL DSP1 Preload Switch' 1"
		cset "name='TL Analog PCM Volume' 17"
		cset "name='WL DSP1 Firmware' 9"
		cset "name='WL PCM Source' 1"
		cset "name='WL DSP RX1 Source' 1"
		cset "name='WL DSP RX2 Source' 1"
		cset "name='WL DSP1 Preload Switch' 1"
		cset "name='WL Analog PCM Volume' 17"
		cset "name='TR DSP1 Firmware' 9"
		cset "name='TR PCM Source' 1"
		cset "name='TR DSP RX1 Source' 1"
		cset "name='TR DSP RX2 Source' 1"
		cset "name='TR DSP1 Preload Switch' 1"
		cset "name='TR Analog PCM Volume' 17"
		cset "name='WR DSP1 Firmware' 9"
		cset "name='WR PCM Source' 1"
		cset "name='WR DSP RX1 Source' 1"
		cset "name='WR DSP RX2 Source' 1"
		cset "name='WR DSP1 Preload Switch' 1"
		cset "name='WR Analog PCM Volume' 17"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='TL Spk Switch' on"
		cset "name='TR Spk Switch' on"
		cset "name='WL Spk Switch' on"
		cset "name='WR Spk Switch' on"
	]
	DisableSequence [
		cset "name='TL Spk Switch' off"
		cset "name='TR Spk Switch' off"
		cset "name='WL Spk Switch' off"
		cset "name='WR Spk Switch' off"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic"
		CaptureChannels 2
	}
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},2"
		JackControl "HDMI/DP,pcm=2 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},3"
		JackControl "HDMI/DP,pcm=3 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI3 {
	Comment "HDMI / DisplayPort 3"
	Value {
		PlaybackPriority 700
		PlaybackPCM "hw:${CardId},4"
		JackControl "HDMI/DP,pcm=4 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI4 {
	Comment "HDMI / DisplayPort 4"
	Value {
		PlaybackPriority 800
		PlaybackPCM "hw:${CardId},5"
		JackControl "HDMI/DP,pcm=5 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
