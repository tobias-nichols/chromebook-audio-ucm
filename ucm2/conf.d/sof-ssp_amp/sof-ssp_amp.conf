# sof-ssp_amp cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.brya-vell-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-ssp_amp;(Vell;.*)$"
	}
	True.Define.Profile "/conf.d/sof-ssp_amp/HiFi-brya-vell.conf"
}

If.brya-vell {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-ssp_amp;(Vell;(sku393473|sku393474|sku393475|sku393476|sku393477|sku393478|sku393479|sku393480|sku2147483647|00060101|00060102|00060103|00060104|00060105|00060106|00060107|00060108|7fffffff))$"
	}
	True.Define.Profile "/conf.d/sof-ssp_amp/HiFi-brya-vell.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
