LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic1 {
		type plug
		slave.pcm "hw:${CardId},99"
		ttable.0.0 1
	}
	pcm.chromeos_Mic2 {
		type plug
		slave.pcm "hw:${CardId},99"
		ttable.0.2 1
	}
}

SectionVerb {
	EnableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Headset Mic Switch' off"
		cset "name='ADC Volume' 108"
		cset "name='ADC Boost Switch' on"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='Spk Switch' on"
	]
	DisableSequence [
		cset "name='Spk Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Mixer"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='DAC HPF Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='DAC HPF Switch' off"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic1"
		CaptureChannels 1
	}
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
		CapturePCM "chromeos_Mic2"
		CaptureChannels 1
	}
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='ADC HPF Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='ADC HPF Switch' off"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},5"
		JackControl "HDMI/DP,pcm=5 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},6"
		JackControl "HDMI/DP,pcm=6 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
