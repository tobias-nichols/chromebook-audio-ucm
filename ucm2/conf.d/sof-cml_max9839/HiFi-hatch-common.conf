# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic1.SplitPCM {
	Name "chromeos_Mic1"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Left DAI Sel Mux' Left"
		cset "name='Right DAI Sel Mux' Right"
		cset "name='Left Digital Volume' 138"
		cset "name='Right Digital Volume' 138"
		cset "name='Left Boost Clock Phase' 0"
		cset "name='Right Boost Clock Phase' 3"
		cset "name='Playback Digital Volume' 111"
		cset "name='Playback Digital Switch' on"
		cset "name='Out DACL Mux' DAIL"
		cset "name='Out DACR Mux' DAIR"
		cset "name='Mixer Out FilterL DACL Switch' on"
		cset "name='Mixer Out FilterR DACR Switch' on"
		cset "name='ST Mixer Out FilterL Out FilterL Switch' on"
		cset "name='ST Mixer Out FilterR Out FilterR Switch' on"
		cset "name='Headphone Jack Switch' on"
		cset "name='Headset Mic Switch' on"
		cset "name='Mic Switch' on"
		cset "name='Mic Volume' 5"
		cset "name='Capture Digital Volume' 111"
		cset "name='Capture Digital Switch' on"
		cset "name='Mixin Volume' 10"
		cset "name='Mixin Switch' on"
		cset "name='Mixer In Mic Switch' on"
		cset "name='Out DAIL Mux' ADC"
		cset "name='Out DAIR Mux' ADC"
		cset "name='Gain Ramp Rate' 1"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
	]
	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
		PlaybackMixerElem "Headphone"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Headphone Switch' off"
	]
}

SectionDevice.Line {
	Comment "Line Out"
	Value {
		PlaybackPriority 190
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Headphone"
		JackControl "Line Out Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Headphone Switch' off"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic1"
		Direction Capture
		Device 2
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Switch' off"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},5"
		JackControl "HDMI/DP,pcm=5 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},6"
		JackControl "HDMI/DP,pcm=6 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI3 {
	Comment "HDMI / DisplayPort 3"
	Value {
		PlaybackPriority 700
		PlaybackPCM "hw:${CardId},7"
		JackControl "HDMI/DP,pcm=7 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
