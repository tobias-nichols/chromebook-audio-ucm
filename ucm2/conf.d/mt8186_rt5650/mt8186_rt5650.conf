# mt8186_rt5650 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.corsola-chinchou-1mic-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8186_rt5650;(Chinchou;.*)$"
	}
	True.Define.Profile "/conf.d/mt8186_rt5650/HiFi-corsola-chinchou-1mic.conf"
}

If.corsola-chinchou-1mic {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8186_rt5650;(Chinchou;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku7|sku8|sku9|sku10|sku11|sku2147483647|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000007|00000008|00000009|0000000a|0000000b|7fffffff))$"
	}
	True.Define.Profile "/conf.d/mt8186_rt5650/HiFi-corsola-chinchou-1mic.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
