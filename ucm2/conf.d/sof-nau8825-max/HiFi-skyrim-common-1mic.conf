# sof-nau8825-max: ChromiumOS's skyrim common/audio/ucm-config/sof-nau8825-max.1mic.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic.SplitPCM {
	Name "chromeos_Mic"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Headset.SplitPCM {
	Name "chromeos_Headset"
	Direction Capture
	Channels 1
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Spk Switch' off"
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Frontend PGA Volume' 12"
		cset "name='Mic Volume' 255"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
	EnableSequence [
		cset "name='Spk Switch' on"
		cset "name='Playback Switch' on"
	]
	DisableSequence [
		cset "name='Spk Switch' off"
		cset "name='Playback Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic"
		Direction Capture
		Device 6
		HWChannels 2
		Channels 2
		Channel0 1
		ChannelPos0 FL
		Channel1 0
		ChannelPos1 FR
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Headset"
		Direction Capture
		Device 0
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
}
