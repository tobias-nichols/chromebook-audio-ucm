LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic {
		type plug
		slave.pcm "hw:${CardId},0"
		ttable.0.0 1
		ttable.1.1 1
	}
}

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic"
		CaptureChannels 2
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},2"
		JackControl "HDMI Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
