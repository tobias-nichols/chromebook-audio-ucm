Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic1.SplitPCM {
	Name "chromeos_Mic1"
	Direction Capture
	Channels 2
	HWChannels 4
	HWChannelPos0 FL
	HWChannelPos1 FR
	HWChannelPos2 FL
	HWChannelPos3 FR
}

Macro.chromeos_Mic2.SplitPCM {
	Name "chromeos_Mic2"
	Direction Capture
	Channels 2
	HWChannels 4
	HWChannelPos0 FL
	HWChannelPos1 FR
	HWChannelPos2 FL
	HWChannelPos3 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
		cset "name='Headset Mic Switch' off"
		cset "name='Stereo1 ADC L Mux' 0"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='IF1 01 ADC Swap Mux' 2"
		cset "name='CBJ Boost Volume' 29"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
	]
	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "DAC1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic1"
		Direction Capture
		Device 5
		HWChannels 4
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic2"
		Direction Capture
		Device 5
		HWChannels 4
		Channels 2
		Channel0 2
		ChannelPos0 FL
		Channel1 3
		ChannelPos1 FR
	}
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},2"
		JackControl "HDMI/DP,pcm=2 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},3"
		JackControl "HDMI/DP,pcm=3 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI3 {
	Comment "HDMI / DisplayPort 3"
	Value {
		PlaybackPriority 700
		PlaybackPCM "hw:${CardId},4"
		JackControl "HDMI/DP,pcm=4 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
