# mt8183_da7219_m cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.jacuzzi-damu-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_max98357;(Damu;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_m/HiFi-jacuzzi-damu.conf"
}

If.jacuzzi-willow-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_max98357;(Willow;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_m/HiFi-jacuzzi-willow.conf"
}

If.jacuzzi-willow {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_max98357;(Willow;(sku0|00000000))$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_m/HiFi-jacuzzi-willow.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
