# rk3399-gru-soun cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.bob-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^rk3399-gru-sound;(Bob;.*)$"
	}
	True.Define.Profile "/conf.d/rk3399-gru-soun/HiFi-bob.conf"
}

If.kevin-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^rk3399-gru-sound;(Kevin;.*)$"
	}
	True.Define.Profile "/conf.d/rk3399-gru-soun/HiFi-bob.conf"
}

If.scarlet-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^rk3399-gru-sound;(Scarlet;.*)$"
	}
	True.Define.Profile "/conf.d/rk3399-gru-soun/HiFi-scarlet.conf"
}

If.scarlet {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^rk3399-gru-sound;(Scarlet;(sku0|sku2|sku3|sku6|sku7|00000000|00000002|00000003|00000006|00000007))$"
	}
	True.Define.Profile "/conf.d/rk3399-gru-soun/HiFi-scarlet.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
