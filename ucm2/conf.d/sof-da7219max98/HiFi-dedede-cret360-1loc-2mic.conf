LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic {
		type plug
		slave.pcm "hw:${CardId},5"
		ttable.0.0 1
		ttable.1.1 1
	}
}

SectionVerb {
	EnableSequence [
		cset "name='Playback Digital Volume' 103"
		cset "name='Playback Digital Switch' 1"
		cset "name='Headphone Volume' 57"
		cset "name='Out DACL Mux' DAIL"
		cset "name='Out DACR Mux' DAIR"
		cset "name='Mixer Out FilterL DACL Switch' 1"
		cset "name='Mixer Out FilterR DACR Switch' 1"
		cset "name='ST Mixer Out FilterL Out FilterL Switch' 1"
		cset "name='ST Mixer Out FilterR Out FilterR Switch' 1"
		cset "name='Headphone Jack Switch' off"
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Volume' 5"
		cset "name='Capture Digital Volume' 110"
		cset "name='Capture Digital Switch' 1"
		cset "name='Mixin Volume' 9"
		cset "name='Mixin Switch' 1"
		cset "name='Mixer In Mic Switch' 1"
		cset "name='Out DAIL Mux' ADC"
		cset "name='Out DAIR Mux' ADC"
		cset "name='Gain Ramp Rate' 1"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='Spk Switch' on"
	]
	DisableSequence [
		cset "name='Spk Switch' off"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Headphone Switch' 1"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Headphone Switch' 0"
	]
}

SectionDevice.Line {
	Comment "Line Out"
	Value {
		PlaybackPriority 190
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Headphone"
		JackControl "Line Out Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
		cset "name='Headphone Switch' 1"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
		cset "name='Headphone Switch' 0"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic"
		CaptureChannels 2
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Switch' off"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},2"
		JackControl "HDMI/DP,pcm=2 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},3"
		JackControl "HDMI/DP,pcm=3 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.HDMI3 {
	Comment "HDMI / DisplayPort 3"
	Value {
		PlaybackPriority 700
		PlaybackPCM "hw:${CardId},4"
		JackControl "HDMI/DP,pcm=4 Jack"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
