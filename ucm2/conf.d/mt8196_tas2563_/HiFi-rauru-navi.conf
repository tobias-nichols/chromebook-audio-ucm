# From chromebook-audio-ucm; see its README for background.

LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic1 {
		type plug
		slave.pcm "hw:${CardId},2"
		ttable.0.0 1
		ttable.1.1 1
	}
	pcm.chromeos_Mic2 {
		type plug
		slave.pcm "hw:${CardId},4"
		ttable.0.0 1
		ttable.1.1 1
	}
	pcm.chromeos_Headset {
		type plug
		slave.pcm "hw:${CardId},3"
		ttable.0.0 1
		ttable.1.1 1
	}
}

SectionVerb {
	EnableSequence [
		cset "name='DAC1 MIXL DAC1 Switch' 1"
		cset "name='DAC1 MIXR DAC1 Switch' 1"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
		cset "name='DAC L1 Source' 'Stereo1 DAC Mixer'"
		cset "name='DAC R1 Source' 'Stereo1 DAC Mixer'"
		cset "name='STO1 ADC Capture Switch' off"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='Stereo1 ADC L Mux' 0"
		cset "name='IF1 01 ADC Swap Mux' 2"
		cset "name='CBJ Boost Volume' 28"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
		cset "name='HDMI_CH0_MUX' CH0"
		cset "name='HDMI_CH1_MUX' CH1"
		cset "name='HDMI_CH2_MUX' CH2"
		cset "name='HDMI_CH3_MUX' CH3"
		cset "name='HDMI_CH4_MUX' CH4"
		cset "name='HDMI_CH5_MUX' CH5"
		cset "name='HDMI_CH6_MUX' CH6"
		cset "name='HDMI_CH7_MUX' CH7"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='I2SOUT4_CH1 DL_24CH_CH1' 1"
		cset "name='I2SOUT4_CH2 DL_24CH_CH2' 1"
		cset "name='I2SOUT4_CH3 DL_24CH_CH3' 1"
		cset "name='I2SOUT4_CH4 DL_24CH_CH4' 1"
	]
	DisableSequence [
		cset "name='I2SOUT4_CH1 DL_24CH_CH1' 0"
		cset "name='I2SOUT4_CH2 DL_24CH_CH2' 0"
		cset "name='I2SOUT4_CH3 DL_24CH_CH3' 0"
		cset "name='I2SOUT4_CH4 DL_24CH_CH4' 0"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='I2SOUT6_CH1 DL1_CH1' 1"
		cset "name='I2SOUT6_CH2 DL1_CH2' 1"
	]
	DisableSequence [
		cset "name='I2SOUT6_CH1 DL1_CH1' 0"
		cset "name='I2SOUT6_CH2 DL1_CH2' 0"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic1"
		CaptureChannels 2
	}
	EnableSequence [
		cset "name='ADDA_UL_Mux' AP_DMIC"
		cset "name='UL0_CH1 ADDA_UL_CH1' 1"
		cset "name='UL0_CH2 ADDA_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='UL0_CH1 ADDA_UL_CH1' 0"
		cset "name='UL0_CH2 ADDA_UL_CH2' 0"
	]
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
		CapturePCM "chromeos_Mic2"
		CaptureChannels 2
	}
	EnableSequence [
		cset "name='ADDA_CH34_UL_Mux' AP_DMIC"
		cset "name='UL2_CH1 ADDA_UL_CH3' 1"
		cset "name='UL2_CH2 ADDA_UL_CH4' 1"
	]
	DisableSequence [
		cset "name='UL2_CH1 ADDA_UL_CH3' 0"
		cset "name='UL2_CH2 ADDA_UL_CH4' 0"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		JackControl "Headset Mic Jack"
		CapturePCM "chromeos_Headset"
		CaptureChannels 2
	}
	EnableSequence [
		cset "name='UL1_CH1 I2SIN6_CH1' 1"
		cset "name='UL1_CH2 I2SIN6_CH2' 1"
	]
	DisableSequence [
		cset "name='UL1_CH1 I2SIN6_CH1' 0"
		cset "name='UL1_CH2 I2SIN6_CH2' 0"
	]
}

SectionDevice.HDMI2 {
	Comment "HDMI / DisplayPort 2"
	Value {
		PlaybackPriority 600
		PlaybackPCM "hw:${CardId},6"
		JackControl "HDMI Jack"
	}
	EnableSequence [
		cset "name='I2SOUT3_CH1 DL2_CH1' 1"
		cset "name='I2SOUT3_CH2 DL2_CH2' 1"
	]
	DisableSequence [
		cset "name='I2SOUT3_CH1 DL2_CH1' 0"
		cset "name='I2SOUT3_CH2 DL2_CH2' 0"
	]
}
