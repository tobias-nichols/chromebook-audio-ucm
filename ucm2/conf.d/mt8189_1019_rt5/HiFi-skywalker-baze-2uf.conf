# mt8189_1019_rt5682s: ChromiumOS's skywalker baze/audio/ucm-config/mt8189_1019_rt5682s.2uf.baze.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic1.SplitPCM {
	Name "chromeos_Mic1"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Mic2.SplitPCM {
	Name "chromeos_Mic2"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Headset.SplitPCM {
	Name "chromeos_Headset"
	Direction Capture
	Channels 1
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='DAC1 Playback Volume' 126"
		cset "name='STO1 ADC Capture Volume' 47"
		cset "name='CBJ Boost Volume' 15"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' 1"
		cset "name='I2SOUT1_CH2 DL0_CH2' 1"
	]
	DisableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' 0"
		cset "name='I2SOUT1_CH2 DL0_CH2' 0"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='I2SOUT0_CH1 DL1_CH1' 1"
		cset "name='I2SOUT0_CH2 DL1_CH2' 1"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]
	DisableSequence [
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
		cset "name='I2SOUT0_CH1 DL1_CH1' 0"
		cset "name='I2SOUT0_CH2 DL1_CH2' 0"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic1"
		Direction Capture
		Device 2
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
		cset "name='UL0_CH1 AP_DMIC_UL_CH1' 1"
		cset "name='UL0_CH2 AP_DMIC_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='UL0_CH1 AP_DMIC_UL_CH1' 0"
		cset "name='UL0_CH2 AP_DMIC_UL_CH2' 0"
	]
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic2"
		Direction Capture
		Device 2
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
		cset "name='UL0_CH1 AP_DMIC_UL_CH1' 1"
		cset "name='UL0_CH2 AP_DMIC_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='UL0_CH1 AP_DMIC_UL_CH1' 0"
		cset "name='UL0_CH2 AP_DMIC_UL_CH2' 0"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Headset"
		Direction Capture
		Device 3
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
	EnableSequence [
		cset "name='UL1_CH1 I2SIN0_CH1' 1"
		cset "name='UL1_CH2 I2SIN0_CH2' 1"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='RECMIX1R CBJ Switch' 1"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]
	DisableSequence [
		cset "name='UL1_CH1 I2SIN0_CH1' 0"
		cset "name='UL1_CH2 I2SIN0_CH2' 0"
		cset "name='RECMIX1L CBJ Switch' 0"
		cset "name='RECMIX1R CBJ Switch' 0"
		cset "name='Stereo1 ADC L1 Mux' 0"
		cset "name='Stereo1 ADC R1 Mux' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
	]
}
