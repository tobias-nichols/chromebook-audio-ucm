# mt8189_35l51_rt cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.jedi-padme-mt8189_35l51_rt5682i-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8189_35l51_rt5682i;(Padme;.*)$"
	}
	True.Define.Profile "/conf.d/mt8189_35l51_rt/HiFi-jedi-padme-mt8189_35l51_rt5682i.conf"
}

If.jedi-padme-mt8189_35l51_rt5682s-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8189_35l51_rt5682s;(Padme;.*)$"
	}
	True.Define.Profile "/conf.d/mt8189_35l51_rt/HiFi-jedi-padme-mt8189_35l51_rt5682s.conf"
}

If.jedi-padme-mt8189_35l51_rt5682i {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8189_35l51_rt5682i;(Padme;(sku290|sku546|sku802|sku1058|sku1314|sku1570|sku1826|sku2082|sku2338|sku2594|sku2850|sku3106|sku3362|sku3618|sku3874|sku4130|sku4386|sku4642|sku4898|sku5154|sku5410|sku5666|sku5922|sku6178|sku6434|sku6690|sku6946|sku7202|sku7458|sku7714|sku7970|sku8226|sku8482|sku8738|sku8994|sku2147483426|00000122|00000222|00000322|00000422|00000522|00000622|00000722|00000822|00000922|00000a22|00000b22|00000c22|00000d22|00000e22|00000f22|00001022|00001122|00001222|00001322|00001422|00001522|00001622|00001722|00001822|00001922|00001a22|00001b22|00001c22|00001d22|00001e22|00001f22|00002022|00002122|00002222|00002322|7fffff22))$"
	}
	True.Define.Profile "/conf.d/mt8189_35l51_rt/HiFi-jedi-padme-mt8189_35l51_rt5682i.conf"
}

If.jedi-padme-mt8189_35l51_rt5682s {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8189_35l51_rt5682s;(Padme;(sku290|sku546|sku802|sku1058|sku1314|sku1570|sku1826|sku2082|sku2338|sku2594|sku2850|sku3106|sku3362|sku3618|sku3874|sku4130|sku4386|sku4642|sku4898|sku5154|sku5410|sku5666|sku5922|sku6178|sku6434|sku6690|sku6946|sku7202|sku7458|sku7714|sku7970|sku8226|sku8482|sku8738|sku8994|sku2147483426|00000122|00000222|00000322|00000422|00000522|00000622|00000722|00000822|00000922|00000a22|00000b22|00000c22|00000d22|00000e22|00000f22|00001022|00001122|00001222|00001322|00001422|00001522|00001622|00001722|00001822|00001922|00001a22|00001b22|00001c22|00001d22|00001e22|00001f22|00002022|00002122|00002222|00002322|7fffff22))$"
	}
	True.Define.Profile "/conf.d/mt8189_35l51_rt/HiFi-jedi-padme-mt8189_35l51_rt5682s.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
