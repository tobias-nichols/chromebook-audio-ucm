# mt8192_mt6359 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.asurada-hayato-mt8192_mt6359_rt1015p_rt5682-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682;(Hayato;.*)$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-hayato-mt8192_mt6359_rt1015p_rt5682.conf"
}

If.asurada-hayato-mt8192_mt6359_rt1015p_rt5682s-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682s;(Hayato;.*)$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-hayato-mt8192_mt6359_rt1015p_rt5682s.conf"
}

If.asurada-spherion-mt8192_mt6359_rt1015p_rt5682-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682;(Spherion;.*)$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-spherion-mt8192_mt6359_rt1015p_rt5682.conf"
}

If.asurada-spherion-mt8192_mt6359_rt1015p_rt5682s-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682s;(Spherion;.*)$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-spherion-mt8192_mt6359_rt1015p_rt5682s.conf"
}

If.asurada-spherion-mt8192_mt6359_rt1015p_rt5682 {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682;(Spherion;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku7|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000007))$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-spherion-mt8192_mt6359_rt1015p_rt5682.conf"
}

If.asurada-spherion-mt8192_mt6359_rt1015p_rt5682s {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8192_mt6359_rt1015p_rt5682s;(Spherion;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku7|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000007))$"
	}
	True.Define.Profile "/conf.d/mt8192_mt6359/HiFi-asurada-spherion-mt8192_mt6359_rt1015p_rt5682s.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
