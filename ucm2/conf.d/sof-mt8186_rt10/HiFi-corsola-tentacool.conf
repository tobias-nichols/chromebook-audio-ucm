# sof-mt8186_rt1019_rt5682s: ChromiumOS's corsola tentacool/audio/ucm-config/sof-mt8186_rt1019_rt5682s.tentacool.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic.SplitPCM {
	Name "chromeos_Mic"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Headset.SplitPCM {
	Name "chromeos_Headset"
	Direction Capture
	Channels 1
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1 Switch' 0"
		cset "name='I2S3_CH2 DL1_CH2 Switch' 0"
		cset "name='Mt6366 PGA Volume' 4"
		cset "name='DAC1 Playback Volume' 80"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
		cset "name='CBJ Boost Volume' 28"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
		cset "name='Speakers Switch' 0"
		cset "name='HDMI1 Switch' 0"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},25"
	}
	EnableSequence [
		cset "name='I2S3_HD_Mux' 1"
		cset "name='I2S3_CH1 DL1_CH1 Switch' 1"
		cset "name='I2S3_CH2 DL1_CH2 Switch' 1"
		cset "name='Speakers Switch' 1"
	]
	DisableSequence [
		cset "name='Speakers Switch' 0"
		cset "name='I2S3_CH1 DL1_CH1 Switch' 0"
		cset "name='I2S3_CH2 DL1_CH2 Switch' 0"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},26"
		PlaybackMixerElem "DAC1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='I2S1_HD_Mux' 1"
		cset "name='I2S1_CH1 DL2_CH1 Switch' on"
		cset "name='I2S1_CH2 DL2_CH2 Switch' on"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]
	DisableSequence [
		cset "name='I2S1_HD_Mux' 0"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
		cset "name='I2S1_CH1 DL2_CH1 Switch' 0"
		cset "name='I2S1_CH2 DL2_CH2 Switch' 0"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic"
		Direction Capture
		Device 27
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
		cset "name='MTKAIF_DMIC Switch' 1"
		cset "name='Mt6366 Mic Type Mux' 2"
		cset "name='UL1_CH1 ADDA_UL_CH2 Switch' 1"
		cset "name='UL1_CH2 ADDA_UL_CH1 Switch' 1"
	]
	DisableSequence [
		cset "name='MTKAIF_DMIC Switch' 0"
		cset "name='UL1_CH1 ADDA_UL_CH2 Switch' 0"
		cset "name='UL1_CH2 ADDA_UL_CH1 Switch' 0"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Headset"
		Direction Capture
		Device 28
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
	EnableSequence [
		cset "name='Stereo1 ADC L Mux' 0"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='IF1 01 ADC Swap Mux' 2"
		cset "name='I2S0_HD_Mux' 1"
		cset "name='UL2_CH1 I2S0_CH1 Switch' 1"
		cset "name='UL2_CH2 I2S0_CH2 Switch' 1"
	]
	DisableSequence [
		cset "name='I2S0_HD_Mux' 0"
		cset "name='UL2_CH1 I2S0_CH1 Switch' 0"
		cset "name='UL2_CH2 I2S0_CH2 Switch' 0"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},25"
		JackControl "HDMI Jack"
	}
	EnableSequence [
		cset "name='I2S3_HD_Mux' 1"
		cset "name='I2S3_CH1 DL1_CH1 Switch' 1"
		cset "name='I2S3_CH2 DL1_CH2 Switch' 1"
		cset "name='HDMI1 Switch' 1"
	]
	DisableSequence [
		cset "name='I2S3_HD_Mux' 0"
		cset "name='I2S3_CH1 DL1_CH1 Switch' 0"
		cset "name='I2S3_CH2 DL1_CH2 Switch' 0"
		cset "name='HDMI1 Switch' 0"
	]
}
