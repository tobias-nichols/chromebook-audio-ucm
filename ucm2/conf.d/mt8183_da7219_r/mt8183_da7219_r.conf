If.jacuzzi-makomo {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Makomo;(sku0|sku1|00000000|00000001))$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-jacuzzi-makomo.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
