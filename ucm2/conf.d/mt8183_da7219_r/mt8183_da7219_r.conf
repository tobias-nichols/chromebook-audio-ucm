# mt8183_da7219_r cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.jacuzzi-fennel-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Fennel;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-jacuzzi-fennel.conf"
}

If.jacuzzi-makomo-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Makomo;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-jacuzzi-makomo.conf"
}

If.kukui-kakadu-mt8183_da7219_rt1015-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015;(Kakadu;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-kukui-kakadu-mt8183_da7219_rt1015.conf"
}

If.kukui-kakadu-mt8183_da7219_rt1015p-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Kakadu;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-kukui-kakadu-mt8183_da7219_rt1015p.conf"
}

If.kukui-katsu-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Katsu;.*)$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-kukui-katsu.conf"
}

If.jacuzzi-fennel {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Fennel;(sku1|sku6|sku7|00000001|00000006|00000007))$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-jacuzzi-fennel.conf"
}

If.jacuzzi-fennel14 {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^mt8183_da7219_rt1015p;(Fennel;(sku0|sku2|00000000|00000002))$"
	}
	True.Define.Profile "/conf.d/mt8183_da7219_r/HiFi-jacuzzi-fennel14.conf"
