# sof-da7219 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.brya-xol-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-da7219;(Xol;.*)$"
	}
	True.Define.Profile "/conf.d/sof-da7219/HiFi-brya-xol.conf"
}

If.nissa-meliks-max98360-da7219-1uf1wf-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-da7219;(Meliks;.*)$"
	}
	True.Define.Profile "/conf.d/sof-da7219/HiFi-nissa-meliks-max98360-da7219-1uf1wf.conf"
}

If.brya-xol {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-da7219;(Xol;(sku1638401|sku1638402|sku1638403|sku1638404|sku2147483647|00190001|00190002|00190003|00190004|7fffffff))$"
	}
	True.Define.Profile "/conf.d/sof-da7219/HiFi-brya-xol.conf"
}

If.nissa-meliks-max98360-da7219-1uf1wf {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-da7219;(Meliks;(sku4915200|sku2147483647|004b0000|7fffffff))$"
	}
	True.Define.Profile "/conf.d/sof-da7219/HiFi-nissa-meliks-max98360-da7219-1uf1wf.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
