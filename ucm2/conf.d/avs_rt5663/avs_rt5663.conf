# avs_rt5663 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.eve-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S ALC5663;(Eve;.*)$"
	}
	True.Define.Profile "/conf.d/avs_rt5663/HiFi-eve.conf"
}

If.soraka-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S ALC5663;(Soraka;.*)$"
	}
	True.Define.Profile "/conf.d/avs_rt5663/HiFi-soraka.conf"
}

If.fizz {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S ALC5663;(Fizz;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku8|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000008))$"
	}
	True.Define.Profile "/conf.d/avs_rt5663/HiFi-fizz.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
