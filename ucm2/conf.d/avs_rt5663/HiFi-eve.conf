# AVS I2S ALC5663: ChromiumOS's
#   eve audio-config/ucm-config/avs_rt5663
#   soraka audio-config/ucm-config/avs_rt5663
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Volume' 16"
		cset "name='Headset Mic Switch' off"
		cset "name='STO1 ADC MIXL ADC1 Switch' on"
		cset "name='ADC Capture Volume' 35"
		cset "name='DAC L Mux' STO DAC MIXL"
		cset "name='DAC R Mux' STO DAC MIXR"
		cset "name='STO1 DAC MIXL DAC L Switch' on"
		cset "name='STO1 DAC MIXR DAC R Switch' on"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "DAC"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
}
