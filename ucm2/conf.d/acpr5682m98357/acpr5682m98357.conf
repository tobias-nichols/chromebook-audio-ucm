# acpr5682m98357 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.grunt-1micbarla-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpr5682m98357;(Grunt;.*)$"
	}
	True.Define.Profile "/conf.d/acpr5682m98357/HiFi-grunt-1micbarla.conf"
}

If.grunt-1micbarla {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpr5682m98357;(Grunt;(sku44|sku45|sku46|sku47|0000002c|0000002d|0000002e|0000002f))$"
	}
	True.Define.Profile "/conf.d/acpr5682m98357/HiFi-grunt-1micbarla.conf"
}

If.grunt-1mictreeya {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpr5682m98357;(Grunt;(sku190|000000be))$"
	}
	True.Define.Profile "/conf.d/acpr5682m98357/HiFi-grunt-1micbarla.conf"
}

If.grunt-2mictreeya {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpr5682m98357;(Grunt;(sku191|000000bf))$"
	}
	True.Define.Profile "/conf.d/acpr5682m98357/HiFi-grunt-2mictreeya.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
