LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic1 {
		type plug
		slave.pcm "hw:${CardId},0"
		ttable.0.1 1
	}
	pcm.chromeos_Mic2 {
		type plug
		slave.pcm "hw:${CardId},0"
		ttable.0.2 1
	}
}

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic1"
		CaptureChannels 1
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
		CapturePCM "chromeos_Mic2"
		CaptureChannels 1
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
