# AVS DMIC: ChromiumOS's coral nasher/audio/ucm-config/avs_dmic.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic.SplitPCM {
	Name "chromeos_Mic"
	Direction Capture
	Channels 1
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic"
		Direction Capture
		Device 0
		HWChannels 2
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
