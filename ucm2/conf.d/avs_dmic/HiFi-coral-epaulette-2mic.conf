LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic {
		type plug
		slave.pcm "hw:${CardId},0"
		ttable.0.0 1
		ttable.1.1 1
	}
}

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic"
		CaptureChannels 2
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
