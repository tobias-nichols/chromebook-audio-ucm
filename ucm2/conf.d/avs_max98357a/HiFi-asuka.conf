SectionVerb {
	EnableSequence [
		cset "name='Spk Switch' on"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
