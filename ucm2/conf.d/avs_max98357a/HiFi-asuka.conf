# AVS I2S MAX98357A: ChromiumOS's
#   asuka audio-config/ucm-config/sklnau8825max, since removed
#   cave audio-config/ucm-config/sklnau8825max, since removed
#   lars audio-config/ucm-config/sklnau8825max, since removed
#   sentry audio-config/ucm-config/sklnau8825max, since removed
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

SectionVerb {
	EnableSequence [
		cset "name='Spk Switch' on"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
