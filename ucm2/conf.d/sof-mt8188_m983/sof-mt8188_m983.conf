# sof-mt8188_m983 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.geralt-ciri-sof_mt8188_m98390_5682-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-mt8188_m98390_5682;(Ciri;.*)$"
	}
	True.Define.Profile "/conf.d/sof-mt8188_m983/HiFi-geralt-ciri-sof_mt8188_m98390_5682.conf"
}

If.geralt-ciri-sof_mt8188_m98390_8326-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-mt8188_m98390_8326;(Ciri;.*)$"
	}
	True.Define.Profile "/conf.d/sof-mt8188_m983/HiFi-geralt-ciri-sof_mt8188_m98390_8326.conf"
}

If.geralt-ciri-sof_mt8188_m98390_5682 {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-mt8188_m98390_5682;(Ciri;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku7|sku8|sku9|sku10|sku11|sku2147483409|sku2147483426|sku2147483443|sku2147483647|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000007|00000008|00000009|0000000a|0000000b|7fffff11|7fffff22|7fffff33|7fffffff))$"
	}
	True.Define.Profile "/conf.d/sof-mt8188_m983/HiFi-geralt-ciri-sof_mt8188_m98390_5682.conf"
}

If.geralt-ciri-sof_mt8188_m98390_8326 {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^sof-mt8188_m98390_8326;(Ciri;(sku0|sku1|sku2|sku3|sku4|sku5|sku6|sku7|sku8|sku9|sku10|sku11|sku2147483409|sku2147483426|sku2147483443|sku2147483647|00000000|00000001|00000002|00000003|00000004|00000005|00000006|00000007|00000008|00000009|0000000a|0000000b|7fffff11|7fffff22|7fffff33|7fffffff))$"
	}
	True.Define.Profile "/conf.d/sof-mt8188_m983/HiFi-geralt-ciri-sof_mt8188_m98390_8326.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
