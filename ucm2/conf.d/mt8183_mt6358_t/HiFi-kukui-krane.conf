# mt8183_mt6358_ts3a227_max98357: ChromiumOS's kukui krane/audio/ucm-config.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic.SplitPCM {
	Name "chromeos_Mic"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Headphone Volume' 0"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1' 1"
		cset "name='I2S3_CH2 DL1_CH2' 1"
	]
	DisableSequence [
		cset "name='I2S3_CH1 DL1_CH1' 0"
		cset "name='I2S3_CH2 DL1_CH2' 0"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic"
		Direction Capture
		Device 5
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
		cset "name='MTKAIF_DMIC' 1"
		cset "name='Mic Type Mux' 2"
		cset "name='UL3_CH1 ADDA_UL_CH1' 1"
		cset "name='UL3_CH2 ADDA_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='MTKAIF_DMIC' 0"
		cset "name='UL3_CH1 ADDA_UL_CH1' 0"
		cset "name='UL3_CH2 ADDA_UL_CH2' 0"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},7"
		JackControl "HDMI Jack"
	}
	EnableSequence [
		cset "name='HDMI_CH0_MUX' 0"
		cset "name='HDMI_CH1_MUX' 1"
		cset "name='HDMI_CH2_MUX' 2"
		cset "name='HDMI_CH3_MUX' 3"
		cset "name='HDMI_CH4_MUX' 4"
		cset "name='HDMI_CH5_MUX' 5"
		cset "name='HDMI_CH6_MUX' 6"
		cset "name='HDMI_CH7_MUX' 7"
	]
	DisableSequence [
		cset "name='HDMI_CH0_MUX' 0"
		cset "name='HDMI_CH1_MUX' 0"
		cset "name='HDMI_CH2_MUX' 0"
		cset "name='HDMI_CH3_MUX' 0"
		cset "name='HDMI_CH4_MUX' 0"
		cset "name='HDMI_CH5_MUX' 0"
		cset "name='HDMI_CH6_MUX' 0"
		cset "name='HDMI_CH7_MUX' 0"
	]
}
