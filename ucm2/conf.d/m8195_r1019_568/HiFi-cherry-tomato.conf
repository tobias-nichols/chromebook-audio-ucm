# m8195_r1019_5682s: ChromiumOS's cherry tomato/audio/ucm-config/m8195_r1019_5682s.tomato.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic.SplitPCM {
	Name "chromeos_Mic"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Headset.SplitPCM {
	Name "chromeos_Headset"
	Direction Capture
	Channels 1
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='ETDM_IN1_Clock_Source' a1sys_a2sys"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
		cset "name='UL_SRC_MUX' DMIC"
		cset "name='ETDM_OUT1_Clock_Source' a1sys_a2sys"
		cset "name='Stereo1 ADC L Mux' 0"
		cset "name='STO1 ADC Capture Switch' off"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='IF1 01 ADC Swap Mux' 2"
		cset "name='CBJ Boost Volume' 28"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='O048 I070 Switch' 1"
		cset "name='O049 I071 Switch' 1"
	]
	DisableSequence [
		cset "name='O048 I070 Switch' 0"
		cset "name='O049 I071 Switch' 0"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='O072 I020 Switch' 1"
		cset "name='O073 I021 Switch' 1"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]
	DisableSequence [
		cset "name='O072 I020 Switch' 0"
		cset "name='O073 I021 Switch' 0"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
	]
}

SectionDevice.HDMI1 {
	Comment "HDMI / DisplayPort 1"
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},5"
		JackControl "DP Jack"
	}
	EnableSequence [
		cset "name='DPTX_OUT_MUX' 1"
	]
	DisableSequence [
		cset "name='DPTX_OUT_MUX' 0"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic"
		Direction Capture
		Device 10
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
		cset "name='MTKAIF_DMIC' On"
		cset "name='O034 I168 Switch' 1"
		cset "name='O035 I169 Switch' 1"
	]
	DisableSequence [
		cset "name='O034 I168 Switch' 0"
		cset "name='O035 I169 Switch' 0"
		cset "name='MTKAIF_DMIC' Off"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Headset"
		Direction Capture
		Device 11
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='O036 I012 Switch' 1"
		cset "name='O037 I013 Switch' 1"
	]
	DisableSequence [
		cset "name='O036 I012 Switch' 0"
		cset "name='O037 I013 Switch' 0"
		cset "name='Headset Mic Switch' off"
	]
}
