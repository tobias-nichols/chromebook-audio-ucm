# avs_max98927 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.eve-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Eve;.*)$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-eve.conf"
}

If.rammus-leona-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Rammus;.*)$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-rammus-leona.conf"
}

If.rammus-shyvana_m-kblda7219m98927-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(M;.*|Shyvana_M;.*)$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-rammus-shyvana_m-kblda7219m98927.conf"
}

If.soraka-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Soraka;.*)$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-soraka.conf"
}

If.rammus-leona {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Rammus;(sku10337|sku10339|00002861|00002863))$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-rammus-leona.conf"
}

If.rammus-shyvana {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Rammus;(sku10851|sku10855|00002a63|00002a67))$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-rammus-shyvana.conf"
}

If.rammus-shyvana_m-avs_max98927 {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^AVS I2S MAX98927;(Rammus;(sku10979|00002ae3))$"
	}
	True.Define.Profile "/conf.d/avs_max98927/HiFi-rammus-shyvana_m-avs_max98927.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
