# AVS I2S MAX98927: ChromiumOS's
#   rammus leona/audio/ucm-config/avs_max98927
#   rammus shyvana-m/audio/ucm-config
#   rammus shyvana-m/audio/ucm-config/avs_max98927
#   rammus shyvana/audio/ucm-config/avs_max98927
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

SectionVerb {
	EnableSequence [
		cset "name='Left DAI Sel Mux' Left"
		cset "name='Right DAI Sel Mux' Right"
		cset "name='Left Speaker Volume' 5"
		cset "name='Right Speaker Volume' 5"
		cset "name='Left Digital Volume' 56"
		cset "name='Right Digital Volume' 56"
		cset "name='Left Current Limit' 3.00A"
		cset "name='Right Current Limit' 3.00A"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='Left VI Sense Switch' on"
		cset "name='Right VI Sense Switch' on"
	]
	DisableSequence [
		cset "name='Left VI Sense Switch' off"
		cset "name='Right VI Sense Switch' off"
	]
}
