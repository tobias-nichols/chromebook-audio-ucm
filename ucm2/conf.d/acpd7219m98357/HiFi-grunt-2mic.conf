# acpd7219m98357: ChromiumOS's grunt ucm-config/acpd7219m98357.2mic.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.
# From chromebook-audio-ucm; see its README for background.

Include.pcm_split.File "/common/pcm/split.conf"

Macro.chromeos_Mic1.SplitPCM {
	Name "chromeos_Mic1"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

Macro.chromeos_Mic2.SplitPCM {
	Name "chromeos_Mic2"
	Direction Capture
	Channels 2
	HWChannels 2
	HWChannelPos0 FL
	HWChannelPos1 FR
}

SectionVerb {
	EnableSequence [
		cset "name='Playback Digital Volume' 111"
		cset "name='Playback Digital Switch' on"
		cset "name='Out DACL Mux' DAIL"
		cset "name='Out DACR Mux' DAIR"
		cset "name='Mixer Out FilterL DACL Switch' on"
		cset "name='Mixer Out FilterR DACR Switch' on"
		cset "name='ST Mixer Out FilterL Out FilterL Switch' on"
		cset "name='ST Mixer Out FilterR Out FilterR Switch' on"
		cset "name='Headphone Switch' off"
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Volume' 5"
		cset "name='Capture Digital Volume' 111"
		cset "name='Capture Digital Switch' on"
		cset "name='Mixin Volume' 10"
		cset "name='Mixin Switch' on"
		cset "name='Mixer In Mic Switch' on"
		cset "name='Out DAIL Mux' ADC"
		cset "name='Out DAIR Mux' ADC"
		cset "name='Gain Ramp Rate' 1"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]
}

SectionDevice.Line {
	Comment "Line Out"
	Value {
		PlaybackPriority 190
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Line Out Jack"
	}
	EnableSequence [
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]
}

SectionDevice.Mic1 {
	Comment "Front Microphone"
	Value {
		CapturePriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic1"
		Direction Capture
		Device 4
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Mic2 {
	Comment "Rear Microphone"
	Value {
		CapturePriority 90
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "chromeos_Mic2"
		Direction Capture
		Device 3
		HWChannels 2
		Channels 2
		Channel0 0
		ChannelPos0 FL
		Channel1 1
		ChannelPos1 FR
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "Headset Mic"
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Mic Switch' off"
	]
}
