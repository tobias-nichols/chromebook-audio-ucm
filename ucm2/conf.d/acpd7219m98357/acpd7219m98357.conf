# acpd7219m98357 cards: the profile for the Chromebook's model and SKU.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

Syntax 8

Define {
	Firmware "$${sys:class/dmi/id/product_name}"
	Sku "$${sys:class/dmi/id/product_sku}$${sys:[type=hex,pos=0,size=4]firmware/devicetree/base/firmware/coreboot/sku-id}"
	Google1 ""
	Profile ""
}
DefineRegex.Google {
	String "$${sys:class/dmi/id/bios_version}$${sys:firmware/devicetree/base/firmware/chromeos/readonly-firmware-version}"
	Regex "^Google_([^.]+)[.]"
}
If.google {
	Condition {
		Type String
		Empty "${var:Google1}"
	}
	False.Define.Firmware "${var:Google1}"
}

If.grunt-1mic-any {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpd7219m98357;(Grunt;.*)$"
	}
	True.Define.Profile "/conf.d/acpd7219m98357/HiFi-grunt-1mic.conf"
}

If.grunt-1mic {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpd7219m98357;(Grunt;(sku16|sku17|sku18|sku19|sku20|sku21|sku22|sku23|sku64|sku65|sku66|sku67|sku68|sku69|sku70|sku71|sku80|sku81|sku82|sku128|sku129|sku130|sku131|sku132|sku133|sku134|sku135|sku160|sku165|sku168|sku174|00000010|00000011|00000012|00000013|00000014|00000015|00000016|00000017|00000040|00000041|00000042|00000043|00000044|00000045|00000046|00000047|00000050|00000051|00000052|00000080|00000081|00000082|00000083|00000084|00000085|00000086|00000087|000000a0|000000a5|000000a8|000000ae))$"
	}
	True.Define.Profile "/conf.d/acpd7219m98357/HiFi-grunt-1mic.conf"
}

If.grunt-1micbarla {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpd7219m98357;(Grunt;(sku32|sku33|sku40|sku41|sku42|sku43|00000020|00000021|00000028|00000029|0000002a|0000002b))$"
	}
	True.Define.Profile "/conf.d/acpd7219m98357/HiFi-grunt-1micbarla.conf"
}

If.grunt-2mic {
	Condition {
		Type RegexMatch
		String "${CardName};${var:Firmware};${var:Sku}"
		Regex "^acpd7219m98357;(Grunt;(sku169|sku175|000000a9|000000af))$"
	}
	True.Define.Profile "/conf.d/acpd7219m98357/HiFi-grunt-2mic.conf"
}

If.profile {
	Condition {
		Type String
		Empty "${var:Profile}"
	}
	False.SectionUseCase."HiFi" {
		File "${var:Profile}"
		Comment "Play HiFi quality Music"
	}
}
