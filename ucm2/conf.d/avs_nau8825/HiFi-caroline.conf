# AVS I2S NAU8825: ChromiumOS's caroline audio-config/ucm-config/sklnau8825adi, since removed.
# Based on ChromiumOS's audio configuration, Copyright The ChromiumOS Authors.

SectionVerb {
	EnableSequence [
		cset "name='DAC Oversampling Rate' 128"
		cset "name='Headset Mic Switch' off"
		cset "name='Frontend PGA Volume' 21"
	]
	DisableSequence [
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='Headphone Jack Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Jack Switch' off"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		JackControl "Headset Mic Jack"
		CaptureMixerElem "Mic"
	}
	EnableSequence [
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]
}
