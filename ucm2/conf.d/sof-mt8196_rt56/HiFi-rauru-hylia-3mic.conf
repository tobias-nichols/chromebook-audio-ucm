# From chromebook-audio-ucm; see its README for background.

LibraryConfig.chromeos.SubstiConfig {
	pcm.chromeos_Mic {
		type plug
		slave.pcm "hw:${CardId},7"
		ttable.0.0 1
		ttable.1.1 1
		ttable.2.2 1
	}
	pcm.chromeos_Headset {
		type plug
		slave.pcm "hw:${CardId},3"
		ttable.0.0 1
	}
}

SectionVerb {
	EnableSequence [
		cset "name='DAC1 L Mux' 'IF1 DAC'"
		cset "name='DAC1 R Mux' 'IF1 DAC'"
		cset "name='DAC1 MIXL DAC1 Switch' 1"
		cset "name='DAC1 MIXR DAC1 Switch' 1"
		cset "name='A DAC1 L Mux' 'DAC1'"
		cset "name='A DAC1 R Mux' 'DAC1'"
		cset "name='ADC Capture Volume' 61,61"
		cset "name='Stereo DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo DAC MIXR DAC R1 Switch' 1"
		cset "name='HDMI_CH0_MUX' CH0"
		cset "name='HDMI_CH1_MUX' CH1"
		cset "name='HDMI_CH2_MUX' CH2"
		cset "name='HDMI_CH3_MUX' CH3"
		cset "name='HDMI_CH4_MUX' CH4"
		cset "name='HDMI_CH5_MUX' CH5"
		cset "name='HDMI_CH6_MUX' CH6"
		cset "name='HDMI_CH7_MUX' CH7"
		cset "name='Headphone Playback Volume' 31"
	]
	DisableSequence [
	]
}

SectionDevice.Speaker {
	Comment "Speaker"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
	EnableSequence [
		cset "name='I2SOUT6_CH1 DL_24CH_CH1' 1"
		cset "name='I2SOUT6_CH2 DL_24CH_CH2' 1"
		cset "name='Speaker Channel Switch' 1,1"
		cset "name='SPK MIXL DAC L1 Switch' 1"
		cset "name='SPK MIXR DAC R1 Switch' 1"
		cset "name='SPOL MIX SPKVOL L Switch' 1"
		cset "name='SPOR MIX SPKVOL R Switch' 1"
		cset "name='SPKVOL L Switch' 1"
		cset "name='SPKVOL R Switch' 1"
	]
	DisableSequence [
		cset "name='I2SOUT6_CH1 DL_24CH_CH1' 0"
		cset "name='I2SOUT6_CH2 DL_24CH_CH2' 0"
		cset "name='Speaker Channel Switch' 0,0"
		cset "name='SPK MIXL DAC L1 Switch' 0"
		cset "name='SPK MIXR DAC R1 Switch' 0"
		cset "name='SPOL MIX SPKVOL L Switch' 0"
		cset "name='SPOR MIX SPKVOL R Switch' 0"
		cset "name='SPKVOL L Switch' 0"
		cset "name='SPKVOL R Switch' 0"
	]
}

SectionDevice.Headphones {
	Comment "Headphones"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cset "name='I2SOUT6_CH1 DL1_CH1' 1"
		cset "name='I2SOUT6_CH2 DL1_CH2' 1"
		cset "name='HPOVOL MIXL DAC1 Switch' 1"
		cset "name='HPOVOL MIXR DAC1 Switch' 1"
		cset "name='Headphone Channel Switch' 1,1"
		cset "name='HPO MIX HPVOL Switch' 1"
		cset "name='HPOVOL L Switch' 1"
		cset "name='HPOVOL R Switch' 1"
	]
	DisableSequence [
		cset "name='I2SOUT6_CH1 DL1_CH1' 0"
		cset "name='I2SOUT6_CH2 DL1_CH2' 0"
		cset "name='HPOVOL MIXL DAC1 Switch' 0"
		cset "name='HPOVOL MIXR DAC1 Switch' 0"
		cset "name='Headphone Channel Switch' 0,0"
		cset "name='HPO MIX HPVOL Switch' 0"
		cset "name='HPOVOL L Switch' 0"
		cset "name='HPOVOL R Switch' 0"
	]
}

SectionDevice.Mic {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "chromeos_Mic"
		CaptureChannels 3
	}
	EnableSequence [
		cset "name='ADDA_UL_Mux' AP_DMIC_MULTI_CH"
		cset "name='ADDA_CH34_UL_Mux' AP_DMIC_MULTI_CH"
		cset "name='UL_CM0_CH1 ADDA_UL_CH1' 1"
		cset "name='UL_CM0_CH2 ADDA_UL_CH2' 1"
		cset "name='UL_CM0_CH3 ADDA_UL_CH3' 1"
	]
	DisableSequence [
		cset "name='UL_CM0_CH1 ADDA_UL_CH1' 0"
		cset "name='UL_CM0_CH2 ADDA_UL_CH2' 0"
		cset "name='UL_CM0_CH3 ADDA_UL_CH3' 0"
	]
}

SectionDevice.Headset {
	Comment "Headset Microphone"
	Value {
		CapturePriority 200
		JackControl "Headset Mic Jack"
		CapturePCM "chromeos_Headset"
		CaptureChannels 1
	}
	EnableSequence [
		cset "name='UL1_CH1 I2SIN6_CH1' 1"
		cset "name='UL1_CH2 I2SIN6_CH2' 1"
		cset "name='RT5650 IF1 ADC1 Swap Mux' 1"
		cset "name='RECMIXL BST1 Switch' 1"
		cset "name='RECMIXR BST1 Switch' 1"
		cset "name='Stereo1 ADC1 Mux' 1"
		cset "name='Sto1 ADC MIXL ADC1 Switch' 1"
		cset "name='Sto1 ADC MIXR ADC1 Switch' 1"
		cset "name='ADC Capture Switch' 1,1"
		cset "name='Headset Mic Switch' 1"
		cset "name='RECMIXL BST1 Switch' on"
		cset "name='RECMIXR BST1 Switch' on"
	]
	DisableSequence [
		cset "name='UL1_CH1 I2SIN6_CH1' 0"
		cset "name='UL1_CH2 I2SIN6_CH2' 0"
		cset "name='RT5650 IF1 ADC1 Swap Mux' 0"
		cset "name='RECMIXL BST1 Switch' 0"
		cset "name='RECMIXR BST1 Switch' 0"
		cset "name='Sto1 ADC MIXL ADC1 Switch' 0"
		cset "name='Sto1 ADC MIXR ADC1 Switch' 0"
		cset "name='ADC Capture Switch' 0,0"
		cset "name='Headset Mic Switch' 0"
		cset "name='RECMIXL BST1 Switch' 0"
		cset "name='RECMIXR BST1 Switch' 0"
	]
}
